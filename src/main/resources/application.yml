server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          # 1. KURAL: Sipariş Servisi Rotası
          - id: order-service
            uri: lb://order-service
            predicates:
              - Path=/api/order/**

          # 2. KURAL: Stok Servisi Rotası
          - id: inventory-service
            uri: lb://inventory-service
            predicates:
              - Path=/api/inventory/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/